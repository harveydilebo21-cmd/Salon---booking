name: CI

on:
  push:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven          # keeps downloaded libraries between runs, so later runs are faster

      - name: Compile and run the tests
        run: mvn -B verify

  docker:
    name: Build the Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t salon-booking:ci .