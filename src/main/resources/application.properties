spring.application.name=booking

# Local development database (the docker-compose database is published on localhost only)
spring.datasource.url=jdbc:postgresql://localhost:5432/salon
spring.datasource.username=salon
spring.datasource.password=salon_dev_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Secrets come from environment variables. The fallbacks after the colon are for local
# development only and must never be used on a real server.
salon.stylist.username=${STYLIST_USERNAME:stylist}
salon.stylist.password=${STYLIST_PASSWORD:dev-only-change-me}
salon.calendar.token=${CALENDAR_TOKEN:dev-calendar-token-change-me}

# Bookings whose appointment time is older than this many days are deleted every night
salon.retention.days=10

# ---- Public details shown on the website. Replace with the salon's real details. ----
salon.business.name=Makwena Salon
salon.business.tagline=Professional hair care, by appointment
# A short paragraph in the stylist's own words. Leave empty to hide the About section.
salon.business.about=A small professional salon dedicated in providing quality hairstyles and other services at an affordable price.
salon.business.phone=27 66 016 4678
# WhatsApp number in international format, digits only. Leave empty to hide the button.
salon.business.whatsapp=066 016 4678
salon.business.email=
salon.business.address=6352 Eucalyptus street Chief Albert Luthuli Park Benoni 1500
# One entry per line on the page, separated by commas
salon.business.hours=Mon to Fri: 08:00 - 17:00,Sat: 08:00 - 14:00,Sun: 09:00 - 13:00
# Full link, for example https://www.instagram.com/yourhandle. Leave empty to hide it.
salon.business.instagram=
# File names inside static/images, separated by commas. Leave empty to hide the gallery.
salon.business.gallery=hero2.jpeg,hero3.jpg