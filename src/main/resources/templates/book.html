<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book an appointment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="card">
        <h1>Book an appointment</h1>
        <p class="muted">Choose a service and a time. The salon will confirm, suggest another time, or let you know if it isn't possible.</p>

        <form th:action="@{/book}" th:object="${bookingForm}" method="post">
            <div class="field">
                <label for="clientName">Your name</label>
                <input type="text" id="clientName" th:field="*{clientName}" autocomplete="name">
                <div class="field-error" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}"></div>
            </div>

            <div class="field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}" autocomplete="tel">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="field">
                <label for="service">Service</label>
                <select id="service" th:field="*{service}">
                    <option value="">Choose a service</option>
                    <option th:each="s : ${services}" th:value="${s}" th:text="${s}"></option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('service')}" th:errors="*{service}"></div>
            </div>

            <div class="field">
                <label for="requestedTime">Preferred date and time</label>
                <input type="datetime-local" id="requestedTime" th:field="*{requestedTime}">
                <div class="field-error" th:if="${#fields.hasErrors('requestedTime')}" th:errors="*{requestedTime}"></div>
            </div>

            <button type="submit">Request booking</button>
        </form>
    </div>
</main>
</body>
</html>
