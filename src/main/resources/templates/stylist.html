<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stylist dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="page-head">
        <h1>Stylist dashboard</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-secondary">Log out</button>
        </form>
    </div>

    <p class="alert ok" th:if="${message}" th:text="${message}"></p>
    <p class="alert err" th:if="${error}" th:text="${error}"></p>

    <h2>Waiting for your decision <span class="count" th:text="${#lists.size(pending)}"></span></h2>
    <p class="muted" th:if="${#lists.isEmpty(pending)}">No requests are waiting. New ones will appear here.</p>

    <div class="request-grid" th:unless="${#lists.isEmpty(pending)}">
        <article class="request" th:each="b : ${pending}">
            <div class="request-head">
                <strong th:text="${b.clientName}"></strong>
                <span class="badge badge-pending">Pending</span>
            </div>
            <p class="when" th:text="${#temporals.format(b.requestedTime, 'EEE d MMM yyyy, HH:mm')}"></p>
            <p class="meta">
                <span th:text="${b.service}"></span><br>
                <a th:href="${'tel:' + b.phone}" th:text="${b.phone}"></a>
            </p>

            <details>
                <summary>Confirm</summary>
                <form th:action="@{/stylist/bookings/{id}/confirm(id=${b.id})}" method="post">
                    <input type="text" name="note" maxlength="255" aria-label="Note for the client"
                           placeholder="Optional note for the client">
                    <button type="submit">Confirm booking</button>
                </form>
            </details>

            <details>
                <summary>Suggest a new time</summary>
                <form th:action="@{/stylist/bookings/{id}/propose(id=${b.id})}" method="post">
                    <input type="datetime-local" name="proposedTime" required aria-label="New time">
                    <input type="text" name="reason" maxlength="255" required aria-label="Reason for the new time"
                           placeholder="Reason for the new time (required)">
                    <button type="submit">Send new time</button>
                </form>
            </details>

            <details>
                <summary>Reject</summary>
                <form th:action="@{/stylist/bookings/{id}/reject(id=${b.id})}" method="post"
                      data-confirm="Reject this booking? The client will see your reason.">
                    <input type="text" name="reason" maxlength="255" required aria-label="Reason for rejecting"
                           placeholder="Reason (required)">
                    <button type="submit" class="btn-danger">Reject booking</button>
                </form>
            </details>
        </article>
    </div>

    <h2>Other bookings</h2>
    <p class="muted" th:if="${#lists.isEmpty(others)}">Nothing here yet.</p>
    <div class="table-wrap" th:unless="${#lists.isEmpty(others)}">
        <table>
            <thead>
            <tr>
                <th>Time</th><th>Client</th><th>Phone</th><th>Service</th>
                <th>Status</th><th>Note</th><th>Proposed time</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${others}">
                <td th:text="${#temporals.format(b.requestedTime, 'EEE d MMM yyyy, HH:mm')}"></td>
                <td th:text="${b.clientName}"></td>
                <td><a th:href="${'tel:' + b.phone}" th:text="${b.phone}"></a></td>
                <td th:text="${b.service}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${'badge-' + #strings.toLowerCase(b.status.name())}"
                          th:text="${#strings.replace(#strings.capitalize(#strings.toLowerCase(b.status.name())), '_', ' ')}"></span>
                </td>
                <td th:text="${b.stylistNote}"></td>
                <td th:text="${b.proposedTime != null ? #temporals.format(b.proposedTime, 'EEE d MMM yyyy, HH:mm') : ''}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
