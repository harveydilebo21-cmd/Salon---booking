services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: salon
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/salon
      SPRING_DATASOURCE_USERNAME: salon
      SPRING_DATASOURCE_PASSWORD: salon_dev_password
      STYLIST_USERNAME: ${STYLIST_USERNAME:-stylist}
      STYLIST_PASSWORD: ${STYLIST_PASSWORD:?Set STYLIST_PASSWORD in the .env file}
      CALENDAR_TOKEN: ${CALENDAR_TOKEN:?Set CALENDAR_TOKEN in the .env file}
      TZ: Africa/Johannesburg
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: